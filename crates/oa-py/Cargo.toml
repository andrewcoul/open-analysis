[package]
name = "oa-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_oa"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
oa-core = { workspace = true, features = ["parallel"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

